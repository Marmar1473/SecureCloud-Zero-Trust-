<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Авторизация | SecureCloud</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f9fafb;
            justify-content: center;
            align-items: center;
            color: #111;
        }

        .auth-container {
            background: #fff;
            width: 400px;
            max-width: 90%;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 1.5em;
            font-weight: 700;
        }

        .auth-header p {
            color: #6b7280;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #f3f4f6;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #9ca3af;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: #111;
            border-color: #000;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85em;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 0.95em;
            background: #f9fafb;
        }

        .form-group input:focus {
            border-color: #000;
            background: #fff;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background: #333;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.85em;
            font-weight: 500;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            z-index: 50;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top-color: #000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-header">
        <h1>SecureCloud</h1>
        <p>Zero-Trust Messenger</p>
    </div>
    <div class="tabs">
        <div class="tab active" id="tabLogin" onclick="switchTab('login')">Вход</div>
        <div class="tab" id="tabRegister" onclick="switchTab('register')">Регистрация</div>
    </div>
    <div id="loginForm">
        <div class="form-group">
            <label>Логин</label>
            <input type="text" id="logUsername" placeholder="Введите логин" autocomplete="off">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="logPassword" placeholder="Введите пароль">
        </div>
        <button class="btn" id="btnLogin" onclick="login()" style="margin-top: 15px;">Войти</button>
        <div class="error-msg" id="logError"></div>
    </div>
    <div id="registerForm" style="display: none;">
        <div class="form-group">
            <label>Придумайте логин</label>
            <input type="text" id="regUsername" placeholder="Уникальный логин" autocomplete="off">
        </div>
        <div class="form-group">
            <label>Придумайте пароль (он зашифрует ключи)</label>
            <input type="password" id="regPassword" placeholder="Минимум 6 символов">
        </div>
        <button class="btn" id="btnRegister" onclick="register()">Создать аккаунт</button>
        <div class="error-msg" id="regError"></div>
    </div>
</div>
<div class="overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div style="font-weight: 600;" id="overlayText">Загрузка...</div>
</div>

<script>
    if (sessionStorage.getItem('jwt_token') && sessionStorage.getItem('sc_private_key')) window.location.href = '/';
    if (window.location.pathname === '/register') switchTab('register', false);
    else document.getElementById('logUsername').focus();

    function setupEnterKey(containerId, btnId) {
        const inputs = document.getElementById(containerId).querySelectorAll('input');
        inputs.forEach((input, index) => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (index < inputs.length - 1) inputs[index + 1].focus();
                    else document.getElementById(btnId).click();
                }
            });
        });
    }

    setupEnterKey('loginForm', 'btnLogin');
    setupEnterKey('registerForm', 'btnRegister');

    function switchTab(tab, updateUrl = true) {
        document.getElementById('logError').textContent = '';
        document.getElementById('regError').textContent = '';
        if (tab === 'login') {
            document.getElementById('tabLogin').classList.add('active');
            document.getElementById('tabRegister').classList.remove('active');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('logUsername').focus();
            if (updateUrl) window.history.pushState({}, '', '/login');
        } else {
            document.getElementById('tabLogin').classList.remove('active');
            document.getElementById('tabRegister').classList.add('active');
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('regUsername').focus();
            if (updateUrl) window.history.pushState({}, '', '/register');
        }
    }

    function buf2b64(buffer) {
        let binary = '';
        const bytes = new Uint8Array(buffer);
        for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
        return window.btoa(binary);
    }

    function b642buf(b64) {
        const binary = window.atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes.buffer;
    }

    async function deriveKeyFromPassword(password, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(password), {name: "PBKDF2"}, false, ["deriveBits", "deriveKey"]);
        return window.crypto.subtle.deriveKey(
            {name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256"},
            keyMaterial, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]
        );
    }

    async function login() {
        const user = document.getElementById('logUsername').value.trim();
        const pass = document.getElementById('logPassword').value;
        const errDiv = document.getElementById('logError');
        if (!user || !pass) {
            errDiv.textContent = "Заполните все поля";
            return;
        }

        document.getElementById('overlayText').textContent = "Вход в систему...";
        document.getElementById('loadingOverlay').style.display = 'flex';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user, password: pass})
            });

            if (res.ok) {
                const data = await res.json();
                document.getElementById('overlayText').textContent = "Расшифровка ключей...";

                const parts = data.encryptedPrivateKey.split('.');
                const salt = b642buf(parts[0]);
                const iv = b642buf(parts[1]);
                const ciphertext = b642buf(parts[2]);

                const aesKey = await deriveKeyFromPassword(pass, salt);
                try {
                    const privKeyBuf = await window.crypto.subtle.decrypt({
                        name: "AES-GCM",
                        iv: iv
                    }, aesKey, ciphertext);
                    sessionStorage.setItem('sc_private_key', buf2b64(privKeyBuf));
                    sessionStorage.setItem('jwt_token', data.token);
                    window.location.href = '/';
                } catch (decErr) {
                    errDiv.textContent = "Ошибка расшифровки ключа (неверный пароль?)";
                    document.getElementById('loadingOverlay').style.display = 'none';
                }
            } else {
                errDiv.textContent = "Неверный логин или пароль";
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        } catch (e) {
            errDiv.textContent = "Ошибка сети";
            document.getElementById('loadingOverlay').style.display = 'none';
        }
    }

    async function register() {
        const user = document.getElementById('regUsername').value.trim();
        const pass = document.getElementById('regPassword').value;
        const errDiv = document.getElementById('regError');
        if (!user || pass.length < 6) {
            errDiv.textContent = "Логин пуст или пароль короче 6 символов";
            return;
        }

        document.getElementById('overlayText').textContent = "Генерация ключей...";
        document.getElementById('loadingOverlay').style.display = 'flex';

        try {
            const keyPair = await window.crypto.subtle.generateKey({
                name: "ECDH",
                namedCurve: "P-256"
            }, true, ["deriveKey"]);
            const pubKeyBuf = await window.crypto.subtle.exportKey("spki", keyPair.publicKey);
            const privKeyBuf = await window.crypto.subtle.exportKey("pkcs8", keyPair.privateKey);
            const pubKeyB64 = buf2b64(pubKeyBuf);

            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const aesKey = await deriveKeyFromPassword(pass, salt);
            const encryptedPrivKey = await window.crypto.subtle.encrypt({name: "AES-GCM", iv: iv}, aesKey, privKeyBuf);

            const payloadPrivKey = buf2b64(salt) + "." + buf2b64(iv) + "." + buf2b64(encryptedPrivKey);

            document.getElementById('overlayText').textContent = "Регистрация...";
            const res = await fetch('/api/auth/register', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: user,
                    password: pass,
                    publicKey: pubKeyB64,
                    encryptedPrivateKey: payloadPrivKey
                })
            });

            if (res.ok) {
                const loginRes = await fetch('/api/auth/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: user, password: pass})
                });
                if (loginRes.ok) {
                    const data = await loginRes.json();
                    sessionStorage.setItem('sc_private_key', buf2b64(privKeyBuf));
                    sessionStorage.setItem('jwt_token', data.token);
                    window.location.href = '/';
                }
            } else {
                errDiv.textContent = "Пользователь уже существует";
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        } catch (e) {
            errDiv.textContent = "Ошибка при регистрации";
            document.getElementById('loadingOverlay').style.display = 'none';
        }
    }
</script>
</body>
</html>
